name: Opdater elpriser

on:
  schedule:
    - cron: "7 * * * *"      # hver time, 7 minutter over
  workflow_dispatch:          # gør det muligt at starte manuelt

permissions:
  contents: write

concurrency:
  group: elpriser
  cancel-in-progress: false

jobs:
  opdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hent priser og tariffer
        run: |
          cat > fetch-prices.mjs << 'SCRIPT'
          import fs from "node:fs/promises";

          const API = "https://api.energidataservice.dk/dataset/";
          const AREA = "DK1";
          const GLN_DSO = "5790001100520";        // Elnet Midt A/S
          const GLN_ENERGINET = "5790000432752";  // Energinet
          const DSO_CODE = "T3001";              // Nettarif C, timeaflaest

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          const dkDate = (off) => {
            const d = new Date();
            d.setDate(d.getDate() + off);
            return new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Copenhagen" }).format(d);
          };
          const backDate = (days) => {
            const d = new Date();
            d.setDate(d.getDate() - days);
            return new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Copenhagen" }).format(d);
          };
          const nextDate = (iso) => {
            const [y, m, dd] = iso.split("-").map(Number);
            const d = new Date(Date.UTC(y, m - 1, dd));
            d.setUTCDate(d.getUTCDate() + 1);
            return d.toISOString().slice(0, 10);
          };

          // Energi Data Service har rate limits. Vent og prøv igen, hvis de svarer 429.
          async function get(dataset, params, forsoeg = 0) {
            const url = API + dataset + "?" + new URLSearchParams(params);
            const r = await fetch(url, { headers: { Accept: "application/json" } });
            if (r.status === 429 && forsoeg < 6) {
              const body = await r.text();
              const m = body.match(/(\d+)\s*second/);
              const vent = (m ? Number(m[1]) : 10) + 3;
              console.log("Rate limit paa " + dataset + " - venter " + vent + " sekunder");
              await sleep(vent * 1000);
              return get(dataset, params, forsoeg + 1);
            }
            if (!r.ok) throw new Error(dataset + " svarede " + r.status + ": " + (await r.text()).slice(0, 300));
            return r.json();
          }

          // Poster med een doegnpris har kun Price1 sat, resten er null.
          // Uden det her taeller fx systemtariffen kun i time 00-01.
          const priceArray = (rec) => {
            const raw = Array.from({ length: 24 }, (_, i) => {
              const v = rec["Price" + (i + 1)];
              return typeof v === "number" ? v : null;
            });
            if (raw.slice(1).every((v) => v === null)) {
              const flad = raw[0] ?? 0;
              return raw.map(() => flad);
            }
            return raw.map((v) => (v === null ? 0 : v));
          };

          const gaelderPaa = (rec, date) =>
            String(rec.ValidFrom).slice(0, 10) <= date &&
            (!rec.ValidTo || String(rec.ValidTo).slice(0, 10) > date);

          const d0 = dkDate(0), d1 = dkDate(1), slut = nextDate(d1);

          // 1) Spotpriser. Markedet koerer 15-minutters intervaller, saa kvarterne lægges sammen til timegennemsnit.
          const spotJs = await get("DayAheadPrices", {
            start: d0, end: slut, limit: "1000",
            filter: JSON.stringify({ PriceArea: [AREA] })
          });
          const buckets = {};
          for (const r of spotJs.records ?? []) {
            const t = r.TimeDK;
            if (!t) continue;
            const p = r.DayAheadPriceDKK;
            if (p === null || p === undefined) continue;
            const date = t.slice(0, 10), h = parseInt(t.slice(11, 13), 10);
            ((buckets[date] ??= {})[h] ??= []).push(p / 1000);   // DKK/MWh -> DKK/kWh
          }

          const days = {};
          for (const date of [d0, d1]) {
            const b = buckets[date];
            if (!b) continue;
            days[date] = {
              spot: Array.from({ length: 24 }, (_, h) => {
                const v = b[h];
                return v && v.length ? v.reduce((x, y) => x + y, 0) / v.length : null;
              })
            };
          }
          if (!days[d0]) throw new Error("Ingen spotpriser for " + d0 + " - skriver ikke data.json");

          // 2) Nettarif fra Elnet Midt, hele perioden i eet kald
          await sleep(4000);
          const dsoJs = await get("DatahubPricelist", {
            start: d0, end: slut, limit: "100",
            filter: JSON.stringify({ GLN_Number: [GLN_DSO], ChargeTypeCode: [DSO_CODE] })
          });

          // 3) Afgifter fra Energinet. start/end filtrerer paa ValidFrom, ikke paa
          //    gyldighedsperioden, og posterne traadte i kraft 1. januar. Derfor et
          //    vindue paa to aar bagud - gaelderPaa vaelger den post der gaelder paa dagen.
          await sleep(4000);
          const enJs = await get("DatahubPricelist", {
            start: backDate(730), end: slut, limit: "5000",
            filter: JSON.stringify({ GLN_Number: [GLN_ENERGINET], ChargeType: ["D03"] })
          });

          for (const date of Object.keys(days)) {
            const drec = (dsoJs.records ?? []).find((r) => gaelderPaa(r, date));
            days[date].dso = drec
              ? { note: drec.Note, code: drec.ChargeTypeCode, prices: priceArray(drec) }
              : null;

            const seen = new Set(), list = [];
            for (const r of enJs.records ?? []) {
              if (!gaelderPaa(r, date) || seen.has(r.Note)) continue;
              seen.add(r.Note);
              list.push({ note: r.Note, prices: priceArray(r) });
            }
            list.sort((a, b) => a.note.localeCompare(b.note, "da"));
            days[date].energinet = list;
          }

          // En groen koersel uden nettarif er vildledende - stop hellere her.
          if (!days[d0].dso) throw new Error("Nettarif ikke fundet for " + d0 + " - skriver ikke data.json");
          if (!days[d0].energinet.length) throw new Error("Ingen Energinet-poster for " + d0 + " - skriver ikke data.json");
          // Elafgiften ligger hos Energinet som posten "Elafgift". Skifter navnet,
          // skal koerslen blive roed frem for at levere en for lav slutpris.
          if (!days[d0].energinet.some((p) => p.note.trim().toLowerCase() === "elafgift"))
            throw new Error("Posten Elafgift mangler for " + d0 + " - skriver ikke data.json");

          // Skriv kun hvis selve tallene har aendret sig, saa der ikke laves en commit i timen
          const fresh = { priceArea: AREA, days };
          let uaendret = false;
          try {
            const old = JSON.parse(await fs.readFile("data.json", "utf8"));
            delete old.generated;
            uaendret = JSON.stringify(old) === JSON.stringify(fresh);
          } catch {}

          if (uaendret) {
            console.log("Ingen aendringer.");
          } else {
            await fs.writeFile("data.json", JSON.stringify({ generated: new Date().toISOString(), ...fresh }));
            console.log("Skrev data.json for " + Object.keys(days).join(" og "));
          }
          SCRIPT
          node fetch-prices.mjs
          rm fetch-prices.mjs

      - name: Gem ændringer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Opdaterede elpriser"
          git push
